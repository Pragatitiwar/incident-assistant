spring:
  application:
    name: incident-assistant
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: claude-haiku-5-5
          max-tokens: 4000
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 384
        distance-type: COSINE_DISTANCE
        index-type: HNSW
    embedding:
      transformer:
        onnx:
          model-uri: https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/onnx/model.onnx
        tokenizer:
          uri: https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/tokenizer.json
  datasource:
    url: jdbc:postgresql://localhost:5432/incident_assistant
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:app}
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
assistant:
  retrieval:
    top-k: 10
  pricing:
    input-per-million: 0.10
    output-per-million: 0.50
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: incident_assistant
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d incident_assistant"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/incident_assistant
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
      ASSISTANT_API_KEY: ${ASSISTANT_API_KEY:?set ASSISTANT_API_KEY in .env}
      ASSISTANT_ADMIN_KEY: ${ASSISTANT_ADMIN_KEY:?set ASSISTANT_ADMIN_KEY in .env}
    ports:
      - "8080:8080"

volumes:
  pgdata: